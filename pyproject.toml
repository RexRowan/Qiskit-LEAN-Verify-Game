[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-lean-verify-game"
version = "0.1.0"
description = "A decidable-checker circuit puzzle package built on Qiskit, with level content shared with the CliffordGame lean4game submission."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rex Rowan" }]
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0,<3",
    "numpy",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
widget = ["ipywidgets>=8.0"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/RexRowan/Qiskit-LEAN-Verify-Game"
"CliffordGame (Lean project)" = "https://github.com/RexRowan/CliffordGame"

[tool.setuptools.packages.find]
where = ["src"]
